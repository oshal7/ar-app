# Single source of truth for app versioning.
# VERSION_NAME  : human-readable semantic version shown to users (e.g. 1.0.0).
# VERSION_CODE_BASE : integer floor for Android's versionCode. The effective
#   versionCode is VERSION_CODE_BASE + <CI run number>, guaranteeing it always
#   increases across builds — a hard requirement for in-place (data-preserving)
#   updates on the device.
#
# To cut a new release: bump VERSION_NAME here, commit, then push tag vX.Y.Z.
VERSION_NAME=1.0.0
VERSION_CODE_BASE=1000
